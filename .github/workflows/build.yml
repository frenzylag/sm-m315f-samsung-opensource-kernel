name: Build Samsung M31 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev \
            python3 git wget tar zip unzip \
            device-tree-compiler

      - name: Cache toolchains
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-clang4639204-gcc49-pie-v1

      - name: Download Clang
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          wget -q 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-9.0.0_r6/clang-4639204.tar.gz' \
            -O clang.tar.gz
          mkdir -p toolchain/clang/host/linux-x86/clang-4639204
          tar -xf clang.tar.gz \
            -C toolchain/clang/host/linux-x86/clang-4639204
          rm clang.tar.gz

      - name: Download GCC toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b pie-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          rm -rf toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/.git


      - name: Install libtinfo5
        run: |
          wget https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.3_amd64.deb \
            -O libtinfo5.deb
          sudo apt install -y ./libtinfo5.deb

      - name: Patch KernelSU/kernel/tools/susfs_compat.mk
        run: git -C KernelSU apply ../ksu-susfs-fix.patch

      - name: Build kernel
        run: |
          chmod +x build_kernel.sh
          bash build_kernel.sh

      - name: Create flashable ZIP
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3
          cd AnyKernel3
          zip -r ../Frenzy-Kernel-SM-M315F.zip .
          cd ..

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: unpackme
          path: Frenzy-Kernel-SM-M315F.zip
